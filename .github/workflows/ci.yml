name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repetitions:
        description: Consecutive full-suite runs per OS (run two batches of 5 for 10)
        type: choice
        default: '5'
        options: ['1', '5']
permissions:
  contents: read
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck tmux jq acl netcat-openbsd util-linux
      - name: Dependencies (Mac)
        if: runner.os == 'macOS'
        run: brew install shellcheck tmux jq flock
      - name: Shellcheck
        run: shellcheck -x bin/* lib/*.sh install.sh config.example.sh tests/run.sh tests/fixtures/*
      - name: Tests
        env:
          REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          # Exercise the system Bash, including macOS Bash 3.2, in children too.
          export PATH="/bin:/usr/bin:/sbin:/usr/sbin:$PATH"
          mkdir -p "$RUNNER_TEMP/devflow-ci"
          bash --version
          git rev-parse HEAD
          case "$REPETITIONS" in 1|5) ;; *) exit 1 ;; esac
          for ((run=1; run<=REPETITIONS; run++)); do
            log="$RUNNER_TEMP/devflow-ci/run-$run.log"
            if bash tests/run.sh > "$log" 2>&1; then
              printf 'Run %s/%s: ' "$run" "$REPETITIONS"
              tail -n 1 "$log" | tee -a "$RUNNER_TEMP/devflow-ci/results.txt"
            else
              tail -n 100 "$log"
              exit 1
            fi
          done
      - name: Full test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: ${{ runner.temp }}/devflow-ci/
